name: Offline skill structure checks

on:
  pull_request:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/check_skill.py'
      - 'tests/**'
      - '.github/workflows/skill-checks.yml'
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/check_skill.py'
      - 'tests/**'
      - '.github/workflows/skill-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Package and fixture structure (no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_skill.py --fixtures
